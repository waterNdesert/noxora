[project]
name = "nexora-backend"
version = "0.1.0"
description = "Nexora FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependency injection uses Depends() in parameter defaults.
ignore = ["B008"]
